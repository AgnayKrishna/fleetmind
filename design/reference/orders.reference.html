<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FleetMind orders board</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>body{margin:0}button{font-family:inherit;cursor:pointer}.card{transition:transform .15s ease, box-shadow .15s ease}.card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(24,25,28,.06),0 10px 24px rgba(24,25,28,.10)}button:focus-visible{outline:2px solid #8F5400;outline-offset:2px}@media (prefers-reduced-motion: reduce){.card{transition:none}.card:hover{transform:none}}</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F2F3F5; font-family: Manrope, sans-serif; color: #18191C; display: flex; flex-direction: column">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid rgba(24,25,28,0.10)">
<div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1C1408"/><path d="M8 20h10l3-5h3v5h-2" fill="none" stroke="#F2A42B" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="22" r="2" fill="#F2A42B"/><circle cx="21" cy="22" r="2" fill="#F2A42B"/></svg> FleetMind</div>
<nav aria-label="Main" style="display: flex; gap: 4px; margin-left: 12px; font-size: 14px; font-weight: 700">
<a style="padding: 9px 14px; color: #5E6168">Map</a><a style="padding: 9px 14px; color: #5E6168">Fleet</a><a aria-current="page" style="padding: 9px 14px; border-radius: 10px; color: #18191C; font-weight: 800; background: rgba(24,25,28,0.06)">Orders</a><a style="padding: 9px 14px; color: #5E6168">Drivers</a><a style="padding: 9px 14px; color: #5E6168">Reports</a>
</nav>
<div style="flex-grow: 1"></div>
<button style="height: 42px; padding: 0 18px; border-radius: 12px; border: 0; background: #F2A42B; color: #1C1408; font-size: 14px; font-weight: 800">New order</button>
<div style="width: 36px; height: 36px; border-radius: 50%; background: #FCEBCB; color: #8F5400; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">AK</div>
</header>
<div style="padding: 20px 24px 0; display: flex; align-items: baseline; gap: 14px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.4px">Orders today</h1>
<span style="font-size: 14px; color: #5E6168">16 orders, €4,860 revenue planned</span>
</div>
<main style="flex-grow: 1; min-height: 0; padding: 16px 24px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px">
<sc-for list="{{cols}}" as="c" hint-placeholder-count="5"><section aria-label="{{c.title}}" style="background: #E7E8EB; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 0; overflow: hidden">
<div style="display: flex; align-items: center; gap: 8px; padding: 2px 4px"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{c.dot}}"></span><h2 style="margin: 0; font-size: 15px; font-weight: 800">{{c.title}}</h2><span style="font-size: 13px; color: #5E6168; font-weight: 700">{{c.n}}</span></div>
<sc-for list="{{c.cards}}" as="o" hint-placeholder-count="3"><article class="card" style="background: #FFFFFF; border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: {{o.edge}}">
<div style="display: flex; justify-content: space-between; font-size: 12px; color: #5E6168; font-weight: 700"><span>{{o.id}}</span><span>{{o.price}}</span></div>
<div style="font-size: 15px; font-weight: 800">{{o.route}}</div>
<div style="font-size: 13px; color: #44474E">{{o.cust}} · {{o.load}}</div>
<div style="font-size: 13px; color: #44474E">{{o.when}}</div>
<div style="font-size: 13px; font-weight: 700; color: {{o.metaCol}}">{{o.meta}}</div>
<button style="display: {{o.btnShow}}; min-height: 38px; border-radius: 10px; border: 0; background: {{o.btnBg}}; color: {{o.btnFg}}; font-size: 13px; font-weight: 800; margin-top: 2px">{{o.btn}}</button>
</article></sc-for>
</section></sc-for>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const E = 'inset 0 0 0 1px rgba(24,25,28,0.08)';
const card = (o) => ({ edge: E, metaCol: '#44474E', btnShow: 'none', btn: '', btnBg: 'rgba(24,25,28,0.05)', btnFg: '#18191C', ...o });
class Component extends DCLogic {
renderVals() {
  return { cols: [
    { title: 'New', dot: '#18191C', n: 3, cards: [
      card({ id:'ORD-2431', price:'€420', route:'Riga port → Ogre', cust:'Baltic Timber', load:'12 pallets, 8.4 t', when:'Pickup 14:30 to 15:00', meta:'Dina suggests LV-T11, free at the depot', metaCol:'#8F5400', btnShow:'block', btn:'Assign LV-T11', btnBg:'#F2A42B', btnFg:'#1C1408' }),
      card({ id:'ORD-2432', price:'€180', route:'Marupe → Jurmala', cust:'Fresh Market', load:'4 pallets, chilled', when:'Pickup 15:10 to 15:40', meta:'Needs a chilled van, none free until 16:00', metaCol:'#5B3FC4', btnShow:'block', btn:'See options' }),
      card({ id:'ORD-2433', price:'€260', route:'Jelgava → Riga', cust:'Agro LV', load:'10 pallets, 6 t', when:'Tomorrow, 08:00' })
    ]},
    { title: 'Assigned', dot: '#2F7FD8', n: 4, cards: [
      card({ id:'ORD-2427', price:'€310', route:'Riga port → Olaine', cust:'Nordic Parts', load:'9 pallets, 5.2 t', when:'Pickup 13:00', meta:'LV-T09 · Edgars, after current load' }),
      card({ id:'ORD-2428', price:'€150', route:'Purvciems → Salaspils', cust:'HomeBox', load:'22 parcels', when:'Pickup 13:30', meta:'LV-V04 · Laura' }),
      card({ id:'ORD-2429', price:'€390', route:'Kekava → Bauska', cust:'Baltic Timber', load:'14 pallets, 9 t', when:'Pickup 14:00', meta:'LV-E02 · Marta, charge stop planned' })
    ]},
    { title: 'In progress', dot: '#1F9D6B', n: 5, cards: [
      card({ id:'ORD-2419', price:'€280', route:'Riga → Jelgava', cust:'Agro LV', load:'11 pallets', when:'Arrives 12:35, on time', meta:'LV-T01 · Peteris' }),
      card({ id:'ORD-2420', price:'€140', route:'Riga → Jugla', cust:'HomeBox', load:'30 parcels', when:'Arrives 12:50, 12 min late', meta:'LV-V12 · Ilze, customer told', metaCol:'#5B3FC4' }),
      card({ id:'ORD-2421', price:'€200', route:'Imanta → Jurmala', cust:'Fresh Market', load:'6 pallets, chilled', when:'Arrives 13:00, on time', meta:'LV-E05 · Santa' })
    ]},
    { title: 'Delivered', dot: '#8A8F98', n: 3, cards: [
      card({ id:'ORD-2411', price:'€240', route:'Riga port → Kekava', cust:'Nordic Parts', load:'8 pallets', when:'Delivered 10:42', meta:'Signed by R. Ozola, photo attached' }),
      card({ id:'ORD-2412', price:'€120', route:'Centre → Plavnieki', cust:'HomeBox', load:'18 parcels', when:'Delivered 11:15', meta:'Invoice ready to send', btnShow:'block', btn:'Send invoice' })
    ]},
    { title: 'Problem', dot: '#D93A3A', n: 1, cards: [
      card({ id:'ORD-2418', price:'€460', route:'Riga → Valmiera', cust:'Baltic Timber', load:'16 pallets, 10 t', when:'Was due 14:10', meta:'LV-T07 broke down on the A2. LV-T03 can take it, arrives 40 min late', metaCol:'#B42828', edge:'inset 0 0 0 2px #D93A3A', btnShow:'block', btn:'Send LV-T03', btnBg:'#F2A42B', btnFg:'#1C1408' })
    ]}
  ]};
}
}
</script>
</body>
</html>
