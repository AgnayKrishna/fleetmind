<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FleetMind fleet table</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
.row:hover{background:#F7F7F8}
.chipbtn{transition:background .15s ease, box-shadow .15s ease}
.chipbtn:focus-visible,.rowbtn:focus-visible{outline:2px solid #8F5400;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.chipbtn{transition:none}}
</style>
</helmet>
<div style="width: 1440px; height: 900px; box-sizing: border-box; background: #F2F3F5; font-family: Manrope, sans-serif; color: #18191C; display: flex; flex-direction: column">
<header style="height: 64px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: #FFFFFF; border-bottom: 1px solid rgba(24,25,28,0.10)">
<div style="display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px"><svg width="28" height="28" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1C1408"/><path d="M8 20h10l3-5h3v5h-2" fill="none" stroke="#F2A42B" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="22" r="2" fill="#F2A42B"/><circle cx="21" cy="22" r="2" fill="#F2A42B"/></svg>FleetMind</div>
<nav aria-label="Main" style="display: flex; gap: 4px; margin-left: 12px">
<a style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #5E6168; text-decoration: none">Map</a>
<a aria-current="page" style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 800; color: #18191C; background: rgba(24,25,28,0.06); text-decoration: none">Fleet</a>
<a style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #5E6168; text-decoration: none">Orders</a>
<a style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #5E6168; text-decoration: none">Drivers</a>
<a style="padding: 9px 14px; border-radius: 10px; font-size: 14px; font-weight: 700; color: #5E6168; text-decoration: none">Reports</a>
</nav>
<div style="flex-grow: 1"></div>
<span style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #5E6168"><span style="width: 8px; height: 8px; border-radius: 50%; background: #1F9D6B; box-shadow: 0 0 0 4px #DDF2E8"></span>Live, updated 2 s ago</span>
<div style="width: 36px; height: 36px; border-radius: 50%; background: #FCEBCB; color: #8F5400; font-weight: 800; font-size: 13px; display: flex; align-items: center; justify-content: center">AK</div>
</header>
<main style="flex-grow: 1; padding: 24px; display: flex; flex-direction: column; gap: 16px; min-height: 0">
<div style="display: flex; align-items: center; gap: 16px">
<h1 style="margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -0.4px">Fleet</h1>
<span style="font-size: 14px; color: #5E6168">30 vehicles, {{shownCount}} shown</span>
<div style="flex-grow: 1"></div>
<label style="display: flex; align-items: center; gap: 8px; width: 320px; height: 42px; padding: 0 14px; box-sizing: border-box; border-radius: 12px; background: #FFFFFF; border: 1px solid rgba(24,25,28,0.12); font-size: 14px; color: #5E6168"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6168" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span style="flex-grow: 1">Search plate, driver or place</span><kbd style="font-family: inherit; font-size: 12px; padding: 2px 6px; border-radius: 6px; background: rgba(24,25,28,0.06)">/</kbd></label>
<button style="height: 42px; padding: 0 16px; border-radius: 12px; border: 1px solid rgba(24,25,28,0.12); background: #FFFFFF; font-size: 14px; font-weight: 700; color: #18191C">Export CSV</button>
</div>
<div role="group" aria-label="Filter by status" style="display: flex; gap: 8px; flex-wrap: wrap">
<sc-for list="{{filters}}" as="f" hint-placeholder-count="7"><button class="chipbtn" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: 0; display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; background: {{f.bg}}; color: {{f.fg}}; box-shadow: {{f.ring}}"><span style="width: 9px; height: 9px; border-radius: 50%; background: {{f.dot}}; border: {{f.dotBorder}}; box-sizing: border-box"></span>{{f.label}}<span style="opacity: 0.7">{{f.count}}</span></button></sc-for>
</div>
<div style="flex-grow: 1; min-height: 0; background: #FFFFFF; border-radius: 18px; box-shadow: 0 1px 2px rgba(24,25,28,0.06), 0 8px 24px rgba(24,25,28,0.06); overflow: hidden; display: flex; flex-direction: column">
<div style="display: grid; grid-template-columns: 150px 150px 150px 1.3fr 1.2fr 90px 110px 110px 1.5fr; gap: 12px; padding: 0 20px; height: 44px; align-items: center; font-size: 12px; font-weight: 700; color: #5E6168; border-bottom: 1px solid rgba(24,25,28,0.10); background: #FAFAFB">
<span>Vehicle</span><span>Driver</span><span>Status</span><span>Where</span><span>Next stop, ETA</span><span>Load</span><span>Fuel / charge</span><span style="color: #18191C">Drive left ▲</span><span>AI note</span>
</div>
<div style="overflow: hidden">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="10"><div class="row" style="display: grid; grid-template-columns: 150px 150px 150px 1.3fr 1.2fr 90px 110px 110px 1.5fr; gap: 12px; padding: 0 20px; height: 56px; align-items: center; font-size: 14px; border-bottom: 1px solid rgba(24,25,28,0.06)">
<span style="display: flex; align-items: center; gap: 10px; font-weight: 800"><span style="width: 26px; height: 14px; border-radius: 4px; background: {{r.vcol}}; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15)" aria-hidden="true"></span>{{r.plate}}</span>
<span>{{r.driver}}</span>
<span><span style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font-size: 12px; font-weight: 700; background: {{r.sbg}}; color: {{r.sfg}}; border: {{r.sborder}}"><span style="width: 7px; height: 7px; border-radius: 50%; background: {{r.sdot}}"></span>{{r.status}}</span></span>
<span style="color: #44474E">{{r.where}}</span>
<span>{{r.next}}</span>
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 44px; height: 6px; border-radius: 3px; background: #ECEDEF; overflow: hidden"><span style="display: block; height: 6px; width: {{r.load}}%; background: #44474E"></span></span><span style="font-size: 12px; color: #5E6168">{{r.load}}%</span></span>
<span style="font-weight: 700; color: {{r.fuelCol}}">{{r.fuel}}</span>
<span style="font-weight: 700">{{r.drive}}</span>
<span style="color: #44474E; font-size: 13px">{{r.note}}</span>
</div></sc-for>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
const S = {
  route:  { label: 'On route',    dot: '#1F9D6B', bg: '#DDF2E8', fg: '#13684A' },
  stop:   { label: 'Loading',     dot: '#2F7FD8', bg: '#E1EDFB', fg: '#1D5FAE' },
  idle:   { label: 'Parked',      dot: '#8A8F98', bg: '#ECEDEF', fg: '#44474E' },
  watch:  { label: 'Delay risk',  dot: '#7C5CE0', bg: '#ECE7FC', fg: '#5B3FC4' },
  act:    { label: 'Act now',     dot: '#D93A3A', bg: '#FBE3E3', fg: '#B42828' },
  off:    { label: 'No signal',   dot: '#5E6168', bg: 'transparent', fg: '#44474E', border: '1px dashed #8A8F98' }
};
const V = { dt: '#2E3035', dv: '#F7F7F5', et: '#F2A42B', ev: '#F6D49A' };
const ROWS = [
  { plate:'LV-T07', v:'et', driver:'Andris Kalnins', s:'act',   where:'A2 near Sigulda',       next:'Stopped, breakdown',  load:80, fuel:'41%', drive:'3 h 10', note:'Max: tow booked, LV-T03 can take the load' },
  { plate:'LV-T03', v:'dt', driver:'Janis Ozols',    s:'watch', where:'Ulmanis gatve, Riga',   next:'Olaine, 13:05 (+25)', load:35, fuel:'62%', drive:'4 h 40', note:'Dina: waiting for your yes to collect LV-T07 load' },
  { plate:'LV-V12', v:'dv', driver:'Ilze Berzina',   s:'watch', where:'Brivibas iela, Riga',   next:'Jugla, 12:50 (+12)',  load:60, fuel:'18%', drive:'2 h 05', note:'Leo: refuel at Circle K Jugla, 9 c cheaper' },
  { plate:'LV-T01', v:'dt', driver:'Peteris Liepa',  s:'route', where:'A8 to Jelgava',         next:'Jelgava, 12:35',      load:90, fuel:'74%', drive:'5 h 20', note:'' },
  { plate:'LV-E02', v:'et', driver:'Marta Vitola',   s:'route', where:'Krasta iela, Riga',     next:'Kekava, 12:55',       load:70, fuel:'55%', drive:'6 h 00', note:'Ruta: charge stop at Kekava fits the route' },
  { plate:'LV-T09', v:'dt', driver:'Edgars Zarins',  s:'stop',  where:'Riga port, terminal 2', next:'Loading, done 13:10', load:20, fuel:'80%', drive:'7 h 15', note:'' },
  { plate:'LV-V04', v:'ev', driver:'Laura Krumina',  s:'route', where:'Purvciems, Riga',       next:'Plavnieki, 12:40',    load:45, fuel:'67%', drive:'6 h 30', note:'' },
  { plate:'LV-T11', v:'dt', driver:'Raimonds Ozolins', s:'idle', where:'Depot, Darzciems',     next:'Free from 14:00',     load:0,  fuel:'88%', drive:'9 h 00', note:'Dina: best match for the 14:30 Ogre order' },
  { plate:'LV-V08', v:'dv', driver:'Kristaps Lacis', s:'off',   where:'Last seen Salaspils, 11:58', next:'Marupe, 13:20',  load:55, fuel:'49%', drive:'4 h 00', note:'Tracker offline 14 min, driver asked on Telegram' },
  { plate:'LV-E05', v:'ev', driver:'Santa Kalnina',  s:'route', where:'Imanta, Riga',          next:'Jurmala, 13:00',      load:30, fuel:'72%', drive:'5 h 45', note:'' }
];
const COUNTS = { all: 30, route: 17, stop: 4, idle: 4, watch: 2, act: 1, off: 2 };
class Component extends DCLogic {
renderVals() {
  const pick = (this.state && this.state.filter) || 'all';
  const keys = ['all','route','stop','idle','watch','act','off'];
  const filters = keys.map(k => {
    const on = k === pick, s = S[k];
    return {
      label: k === 'all' ? 'All' : s.label, count: COUNTS[k], pressed: on ? 'true' : 'false',
      dot: k === 'all' ? '#18191C' : (k === 'off' ? 'transparent' : s.dot),
      dotBorder: k === 'off' ? '2px dashed #5E6168' : '0',
      bg: on ? '#18191C' : '#FFFFFF', fg: on ? '#FFFFFF' : '#18191C',
      ring: on ? 'none' : 'inset 0 0 0 1px rgba(24,25,28,0.12)',
      pick: () => this.setState({ filter: k })
    };
  });
  const rows = ROWS.filter(r => pick === 'all' || r.s === pick).map(r => {
    const s = S[r.s];
    return { ...r, status: s.label, sbg: s.bg, sfg: s.fg, sdot: s.dot, sborder: s.border || '0',
      vcol: V[r.v], fuelCol: parseInt(r.fuel) < 20 ? '#B42828' : '#18191C', note: r.note || '—' };
  });
  return { filters, rows, shownCount: pick === 'all' ? 30 : COUNTS[pick] };
}
}
</script>
</body>
</html>
