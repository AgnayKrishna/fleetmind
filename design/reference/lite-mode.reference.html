<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FleetMind control centre, lite mode on a small laptop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>body{margin:0}button{font-family:inherit;cursor:pointer}</style>
</helmet>
<div style="width: 1366px; height: 768px; position: relative; overflow: hidden; font-family: Manrope, sans-serif; color: #18191C; background: #ECEDEF">
<svg width="1366" height="768" viewBox="0 0 1366 768" aria-label="Map of Riga with vehicles" role="img" style="position: absolute; inset: 0">
<rect width="1366" height="768" fill="#ECEDEF"/>
<path d="M0 520 C 220 480 380 560 560 500 S 900 380 1366 430 L1366 768 L0 768 Z" fill="#D5E1EA"/>
<rect x="760" y="120" width="180" height="110" rx="20" fill="#DFE8DD"/>
<g fill="none" stroke="#FFFFFF" stroke-linecap="round"><path d="M0 300 H1366" stroke-width="14"/><path d="M420 0 V768" stroke-width="14"/><path d="M0 120 L1366 640" stroke-width="10"/><path d="M980 0 L860 768" stroke-width="10"/></g>
<g fill="none" stroke="#F6F6F7" stroke-width="5"><path d="M0 200 H1366"/><path d="M0 420 H1366"/><path d="M640 0 V768"/><path d="M200 0 V768"/><path d="M1180 0 V768"/></g>
<path d="M520 300 C 600 300 640 360 720 380 S 860 380 900 300" fill="none" stroke="#F2A42B" stroke-width="6" stroke-linecap="round"/>
<g transform="translate(520 300)"><circle r="20" fill="#7C5CE0" fill-opacity="0.18"/><rect x="-16" y="-7" width="32" height="14" rx="3" fill="#2E3035"/></g>
<g transform="translate(900 300)"><circle r="22" fill="#D93A3A" fill-opacity="0.2" stroke="#D93A3A" stroke-width="2"/><rect x="-16" y="-7" width="32" height="14" rx="3" fill="#F2A42B"/></g>
<g transform="translate(640 200)"><circle r="18" fill="#1F9D6B" fill-opacity="0.18"/><rect x="-12" y="-6" width="24" height="12" rx="5" fill="#F7F7F5" stroke="#8A8F98"/></g>
<g transform="translate(1100 470)"><circle r="18" fill="#1F9D6B" fill-opacity="0.18"/><rect x="-16" y="-7" width="32" height="14" rx="3" fill="#2E3035"/></g>
<g transform="translate(300 420)"><circle r="18" fill="#2F7FD8" fill-opacity="0.2"/><rect x="-12" y="-6" width="24" height="12" rx="5" fill="#F6D49A"/></g>
<g transform="translate(760 560)"><circle r="18" fill="none" stroke="#5E6168" stroke-width="2" stroke-dasharray="4 4"/><rect x="-12" y="-6" width="24" height="12" rx="5" fill="#F7F7F5" stroke="#8A8F98"/></g>
</svg>
<header style="position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: #FFFFFF; border-bottom: 1px solid rgba(24,25,28,0.12)">
<div style="display: flex; align-items: center; gap: 8px; font-weight: 800; font-size: 16px"><svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#1C1408"/><path d="M8 20h10l3-5h3v5h-2" fill="none" stroke="#F2A42B" stroke-width="2.2" stroke-linejoin="round"/><circle cx="12" cy="22" r="2" fill="#F2A42B"/><circle cx="21" cy="22" r="2" fill="#F2A42B"/></svg>FleetMind</div>
<div style="display: flex; gap: 6px; margin-left: 8px; font-size: 13px; font-weight: 700">
<span style="padding: 6px 10px; border-radius: 999px; background: #DDF2E8; color: #13684A">17 on route</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #ECE7FC; color: #5B3FC4">2 delay risk</span>
<span style="padding: 6px 10px; border-radius: 999px; background: #FBE3E3; color: #B42828">1 act now</span>
</div>
<div style="flex-grow: 1"></div>
<button style="height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid rgba(24,25,28,0.12); background: #FFFFFF; font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 8px"><span style="width: 28px; height: 16px; border-radius: 8px; background: #18191C; position: relative"><span style="position: absolute; right: 2px; top: 2px; width: 12px; height: 12px; border-radius: 50%; background: #FFFFFF"></span></span>Lite mode</button>
<div style="width: 34px; height: 34px; border-radius: 50%; background: #FCEBCB; color: #8F5400; font-weight: 800; font-size: 12px; display: flex; align-items: center; justify-content: center">AK</div>
</header>
<aside aria-label="Needs you" style="position: absolute; left: 12px; top: 68px; width: 300px; background: #FFFFFF; border-radius: 14px; border: 1px solid rgba(24,25,28,0.12); padding: 14px; box-sizing: border-box; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; justify-content: space-between"><h2 style="margin: 0; font-size: 16px; font-weight: 800">Needs you</h2><span style="font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: #FBE3E3; color: #B42828">4</span></div>
<div style="padding: 10px; border-radius: 10px; background: #FBE3E3"><div style="font-size: 14px; font-weight: 800; color: #B42828">LV-T07 broke down</div><div style="font-size: 12px; color: #44474E">A2 near Sigulda · tow booked</div></div>
<div style="padding: 10px; border-radius: 10px; background: #F2F3F5"><div style="font-size: 14px; font-weight: 700">Approve LV-T03 pickup</div><div style="font-size: 12px; color: #5E6168">Dina · saves €140</div></div>
<button style="height: 36px; border-radius: 10px; border: 0; background: rgba(24,25,28,0.05); font-size: 13px; font-weight: 700; color: #18191C">Show 2 more</button>
</aside>
<nav aria-label="Your AI team" style="position: absolute; right: 12px; top: 68px; width: 56px; background: #FFFFFF; border-radius: 14px; border: 1px solid rgba(24,25,28,0.12); padding: 8px 0; display: flex; flex-direction: column; align-items: center; gap: 8px">
<sc-for list="{{team}}" as="m" hint-placeholder-count="5"><button aria-label="{{m.label}}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: {{m.bg}}; color: {{m.fg}}; font-weight: 800; font-size: 14px; position: relative">{{m.i}}<span style="position: absolute; right: 2px; top: 2px; width: 8px; height: 8px; border-radius: 50%; background: {{m.dot}}; border: 2px solid #FFFFFF"></span></button></sc-for>
</nav>
<section aria-label="LV-T03 details" style="position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; width: 560px; background: #FFFFFF; border-radius: 16px; border: 1px solid rgba(24,25,28,0.12); padding: 14px 16px; box-sizing: border-box; display: flex; align-items: center; gap: 14px">
<div style="flex-grow: 1"><div style="font-size: 16px; font-weight: 800">LV-T03 · Janis Ozols</div><div style="font-size: 13px; color: #5E6168">Can collect LV-T07's load, arrives 12:40, 4 h 40 drive left</div></div>
<button style="min-height: 44px; padding: 0 16px; border-radius: 12px; border: 0; background: #F2A42B; color: #1C1408; font-size: 14px; font-weight: 800">Send LV-T03</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1366,"height":768}}'>
class Component extends DCLogic {
renderVals() {
  const m = (i, label, s) => ({ i, label, bg: '#F2F3F5', fg: '#18191C', dot: s });
  return { team: [ m('A','Atlas, coordinating','#1F9D6B'), m('D','Dina, waiting for you','#7C5CE0'), m('M','Max, handling LV-T07','#D93A3A'), m('R','Ruta, planning routes','#1F9D6B'), m('L','Leo, watching fuel','#1F9D6B') ] };
}
}
</script>
</body>
</html>
